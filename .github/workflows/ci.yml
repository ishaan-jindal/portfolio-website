name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ci
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ci
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ci
          JWT_SECRET: ci
          ADMIN_PASSWORD_HASH: ci
          GITHUB_TOKEN: ci
